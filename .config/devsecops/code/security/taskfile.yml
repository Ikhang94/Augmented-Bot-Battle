# https://taskfile.dev
version: "3"

# Artifact Security Scanning Tasks
# Scans Docker images and dependencies for known vulnerabilities using public CVE databases
# Tools: Trivy (container images), OWASP Dependency-Check (.NET dependencies)

vars:
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  REPORTS_DIR: "reports/security"

tasks:
  scan:security:
    desc: "Run all security vulnerability scans on artifacts and dependencies"
    cmds:
      - cmd: echo "Starting artifact security vulnerability scans..."
        silent: true
      - task: scan:security:trivy
      - task: scan:security:dependencies
      - cmd: echo "All security scans completed"
        silent: true

  scan:security:trivy:
    desc: "Scan Docker image for OS and library vulnerabilities with Trivy"
    cmds:
      - echo "Scanning Docker image with Trivy..."
      - mkdir -p {{.REPORTS_DIR}}

      # Check if Trivy is installed, install if not
      - |
        if ! command -v trivy &> /dev/null; then
          echo "Installing Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin 2>/dev/null || true
          if ! command -v trivy &> /dev/null; then
            echo "Trivy installation failed, attempting alternative method..."
            apt-get update && apt-get install -y wget 2>/dev/null || true
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | apt-key add - 2>/dev/null || true
            echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | tee -a /etc/apt/sources.list.d/trivy.list 2>/dev/null || true
            apt-get update && apt-get install -y trivy 2>/dev/null || true
          fi
        fi

      # Scan the Dockerfile for vulnerabilities
      - |
        echo "Analyzing Dockerfile..."
        trivy config .config/docker/Dockerfile.prod \
          --severity {{.TRIVY_SEVERITY}} \
          --format json \
          --output {{.REPORTS_DIR}}/trivy-dockerfile-report.json 2>/dev/null || true

        trivy config .config/docker/Dockerfile.prod \
          --severity {{.TRIVY_SEVERITY}} \
          --format table 2>/dev/null | tee {{.REPORTS_DIR}}/trivy-dockerfile-report.txt || true

      # Scan for filesystem vulnerabilities in the project
      - |
        echo "Scanning project filesystem for vulnerabilities..."
        trivy fs . \
          --severity {{.TRIVY_SEVERITY}} \
          --skip-dirs ".git,.gradle,node_modules,Library" \
          --format json \
          --output {{.REPORTS_DIR}}/trivy-fs-report.json 2>/dev/null || true

        trivy fs . \
          --severity {{.TRIVY_SEVERITY}} \
          --skip-dirs ".git,.gradle,node_modules,Library" \
          --format table 2>/dev/null | tee {{.REPORTS_DIR}}/trivy-fs-report.txt || true

      - echo "Trivy vulnerability scan complete"

  scan:security:dependencies:
    desc: "Scan .NET and Node.js dependencies for known vulnerabilities"
    cmds:
      - echo "Scanning dependencies for vulnerabilities..."
      - mkdir -p {{.REPORTS_DIR}}

      # OWASP Dependency-Check for .NET dependencies
      - |
        echo "Running OWASP Dependency-Check for .NET dependencies..."

        # Try to install Dependency-Check from latest release
        if ! command -v dependency-check.sh &> /dev/null; then
          echo "Installing OWASP Dependency-Check..."
          mkdir -p /opt /tmp/dc-install

          # Try to get latest release from GitHub API
          LATEST_VERSION=$(curl -s https://api.github.com/repos/jeremylong/DependencyCheck_CLI/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")' | head -1)

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "WARNING: Could not determine latest Dependency-Check version from GitHub API"
            echo "Skipping Dependency-Check scan and continuing with Trivy and npm audit."
            echo "SUCCESS: Skipping Dependency-Check scan"
            exit 0
          fi

          DOWNLOAD_URL="https://github.com/jeremylong/DependencyCheck_CLI/releases/download/${LATEST_VERSION}/dependency-check-${LATEST_VERSION#v}-release.zip"
          echo "Downloading Dependency-Check ${LATEST_VERSION} from: $DOWNLOAD_URL"

          if curl -fL "$DOWNLOAD_URL" -o /tmp/dc-install/dc.zip 2>&1; then
            if [ -s /tmp/dc-install/dc.zip ]; then
              if unzip -q /tmp/dc-install/dc.zip -d /opt/; then
                chmod +x /opt/dependency-check/bin/dependency-check.sh
                export PATH="$PATH:/opt/dependency-check/bin"
                echo "SUCCESS: Dependency-Check installed successfully"
              else
                echo "WARNING: Failed to extract Dependency-Check archive, skipping .NET dependency scan"
                exit 0
              fi
            else
              echo "WARNING: Downloaded ZIP is empty, skipping Dependency-Check scan"
              exit 0
            fi
          else
            echo "WARNING: Failed to download Dependency-Check, skipping .NET dependency scan"
            exit 0
          fi
        fi

        if command -v dependency-check.sh &> /dev/null; then
          dependency-check.sh \
            --project "AugmentedBotBattle-Backend" \
            --scan project/Backend/BackendESP \
            --format JSON \
            --out {{.REPORTS_DIR}} || echo "WARNING: Dependency-Check scan encountered an error but continuing..."

          echo "Dependency-Check scan complete"
        else
          echo "WARNING: Dependency-Check not available, skipping .NET dependency scan"
        fi

      # npm audit for Node.js dependencies (if package.json exists)
      - |
        echo "Running npm audit for Node.js dependencies..."

        if [ -f "package.json" ] && command -v npm &> /dev/null; then
          npm audit --audit-level=moderate --json > {{.REPORTS_DIR}}/npm-audit.json 2>/dev/null || true
          npm audit --audit-level=moderate | tee {{.REPORTS_DIR}}/npm-audit.txt || true
          echo "npm audit complete"
        else
          echo "No package.json found or npm not available, skipping npm audit"
        fi

      - echo "Dependency vulnerability scan complete"

  scan:security:report:
    desc: "Generate security scan summary report"
    cmds:
      - echo "Generating security scan summary report..."
      - mkdir -p {{.REPORTS_DIR}}

      - |
        cat > {{.REPORTS_DIR}}/SECURITY-SCAN-SUMMARY.md <<'EOF'
        # Security Artifact Scan Report

        **Generated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        **Project:** AugmentedBotBattle

        ## Overview

        This report summarizes the security vulnerability scans performed on the project's artifacts and dependencies.

        ### Scans Performed

        1. **Trivy Filesystem Scan** - Scans project files for known vulnerabilities
          - Severity threshold: {{.TRIVY_SEVERITY}}
          - Report: `trivy-fs-report.json`, `trivy-fs-report.txt`

        2. **Trivy Dockerfile Scan** - Scans Docker build configuration for security issues
          - Report: `trivy-dockerfile-report.json`, `trivy-dockerfile-report.txt`

        3. **OWASP Dependency-Check** - Scans .NET (NuGet) dependencies for CVEs
          - Report: `dependency-check-report.json`, `dependency-check-report.html`

        4. **npm Audit** - Scans Node.js (npm) packages for vulnerabilities
          - Report: `npm-audit.json`, `npm-audit.txt`

        ## Vulnerability Databases Used

        - **CVE (Common Vulnerabilities and Exposures)**: NIST NVD
        - **Aquasecurity Trivy DB**: Updated regularly with security data
        - **npm Security Database**: npm registry vulnerability data
        - **Sonatype OSS Index**: Open source vulnerability database

        ## Remediation

        For each vulnerability found:
        1. Review the severity level (CRITICAL > HIGH > MEDIUM > LOW)
        2. Check the affected component and available patches
        3. Update dependencies to patched versions
        4. Re-run scans to verify remediation

        ---

        *Generated automatically by DevSecOps pipeline*
        EOF

      - cat {{.REPORTS_DIR}}/SECURITY-SCAN-SUMMARY.md
