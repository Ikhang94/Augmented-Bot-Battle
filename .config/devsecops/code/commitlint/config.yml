---
extends:
  - "@commitlint/config-conventional"
rules:
  body-max-line-length: [2, "always", 200]
  header-max-length: [2, "always", 200]
  body-leading-blank: [1, "always"]
  type-enum: [2, "always", [feat, fix, hotfix, GItignore, docs, style, refactor, perf, test, build, ci, chore, revert, Merge, Squashed, Fixed, Update, Added]]
