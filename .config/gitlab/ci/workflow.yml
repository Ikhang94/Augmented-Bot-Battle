# ===== WORKFLOW RULES =====
# Rules are evaluated in order — first match wins.
workflow:
  rules:
    # Deployment tags: always create a pipeline
    - if: '$CI_COMMIT_TAG == "staging"'
      when: always
    - if: '$CI_COMMIT_TAG == "production"'
      when: always

    # Block semver tags created automatically by version:bump (e.g. 0.1.5)
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never

    # Block the version bump commit pushed to main ([skip ci] in message)
    # Must come BEFORE the generic push → always rule
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never

    # Standard pipeline sources
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: always
    - if: $CI_PIPELINE_SOURCE == 'schedule'
      when: always
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - if: $CI_PIPELINE_SOURCE == 'push'
      when: always
