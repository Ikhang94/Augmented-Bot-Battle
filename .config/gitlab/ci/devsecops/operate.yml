# This is a GitLab CI/CD configuration file for the operate stage in a DevSecOps pipeline.
operate:
  stage: operate
  needs:
    - job: deploy
      optional: true
  tags:
    - docker
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl bash
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin task
  script:
    - task operate
  rules:
    - if: '$CI_COMMIT_TAG == "production"'
      when: always
    - when: never
