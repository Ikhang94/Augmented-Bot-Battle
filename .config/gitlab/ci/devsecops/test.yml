# This is a GitLab CI/CD configuration file for the test stage in a DevSecOps pipeline.
# It is included in the main .gitlab-ci.yml and specifies the test stage of the
# DevSecOps pipeline. It runs unit and integration tests with code coverage.
.test_before_script: &test_before_script
  - apt-get update
  - apt-get install -y curl bash wget git jq
  - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
  - task --version

# Reusable rules for test jobs to run on branches and tags,
# but not on merge requests
.test_rules: &test_rules
  - if: $CI_COMMIT_TAG
    when: never
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    when: never
  - when: always

test:e2e:
  stage: test
  needs: []
  tags:
    - docker
  image: unityci/editor:ubuntu-6000.0.53f1-android-3.2.1
  cache:
    key: "unity-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - project/Unity/ABB/Library/
      - project/Unity/ABB/.gradle/
  before_script: *test_before_script
  script:
    - task test:e2e
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - reports/unity/
    reports:
      junit: reports/unity/playmode-results.xml
  rules: *test_rules
  allow_failure: true

test:unit:
  stage: test
  needs: []
  tags:
    - docker
  image: mcr.microsoft.com/dotnet/sdk:9.0
  cache:
    key: "dotnet-nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/packages
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  before_script: *test_before_script
  script:
    - task test
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - reports/coverage/
    reports:
      junit: reports/coverage/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/coverage.cobertura.xml
  rules: *test_rules

test:integration:
  stage: test
  needs: []
  tags:
    - docker
  image: mcr.microsoft.com/dotnet/sdk:9.0
  cache:
    key: "dotnet-nuget-$CI_COMMIT_REF_SLUG"
    paths:
      - .nuget/packages
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  before_script: *test_before_script
  script:
    - task test:integration
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - reports/coverage/
    reports:
      junit: reports/coverage/integration-test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/integration-coverage.cobertura.xml
  rules: *test_rules