
# This file defines the CI/CD pipeline for building the Unity project and Docker image.
# It is included in the main .gitlab-ci.yml and specifies the build stage of the

# build unity
build:unity:
  stage: build
  needs:
    - job: version:bump
      optional: true
  tags:
    - docker
  image: unityci/editor:ubuntu-6000.0.53f1-android-3.2.1
  cache:
    key: "unity-library-${UNITY_VERSION}-android"
    paths:
      - project/Unity/ABB/Library/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install -y curl bash wget git jq
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
    - rm -rf project/Unity/ABB/Temp/
  script:
    - pwd
    - ls -R
    - task build:unity 2>&1 | tee unity-build.log  # Capture all logs
    - echo "=== Build completed, checking output ==="
    - ls -R project/Unity/ABB || true
    - ls -R build || true
    - ls -R project/build || true
    - ls -R project/Unity/ABB/build || true
    # Upload APK to Azure Blob Storage with versioned name
    - |
      if [ -f "build/unity/GameBuild.apk" ]; then
        echo "📤 Uploading APK to Azure Blob Storage..."
        # Determine version: use git tag if available, otherwise VERSION file
        if [ -n "$CI_COMMIT_TAG" ]; then
          APK_VERSION="$CI_COMMIT_TAG"
        elif [ -f "VERSION" ]; then
          APK_VERSION="$(cat VERSION)"
        else
          APK_VERSION="$CI_COMMIT_SHORT_SHA"
        fi
        APK_NAME="GameBuild-${APK_VERSION}.apk"
        echo "📦 Version : $APK_VERSION → $APK_NAME"
        # Install Azure CLI
        curl -sL https://aka.ms/InstallAzureCLIDeb | bash 2>/dev/null || true
        # Upload versioned APK (ex: GameBuild-0.1.14.apk)
        az storage blob upload \
          --account-name "stabbapkdevfrct01" \
          --account-key "$AZURE_STORAGE_KEY" \
          --container-name "apk" \
          --name "$APK_NAME" \
          --file "build/unity/GameBuild.apk" \
          --overwrite false
        # Also update GameBuild-latest.apk as convenience link
        az storage blob upload \
          --account-name "stabbapkdevfrct01" \
          --account-key "$AZURE_STORAGE_KEY" \
          --container-name "apk" \
          --name "GameBuild-latest.apk" \
          --file "build/unity/GameBuild.apk" \
          --overwrite true
        echo "✅ APK v${APK_VERSION} : https://stabbapkdevfrct01.blob.core.windows.net/apk/${APK_NAME}"
        echo "✅ Dernier APK    : https://stabbapkdevfrct01.blob.core.windows.net/apk/GameBuild-latest.apk"
      else
        echo "⚠️ APK non trouvé à build/unity/GameBuild.apk — upload ignoré"
      fi
  after_script:
    - echo "=== Last 100 lines of Unity build log ==="
    - tail -n 100 unity-build.log || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/unity/
      - unity-build.log  # Include the build log as an artifact
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

# Build Docker image and push to Azure Container Registry
build:all:
  stage: build
  needs:
    - job: build:unity
      artifacts: true
    - job: version:bump
      optional: true
  tags:
    - docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "" # Disable Docker TLS for GitLab CI
    DOCKER_DRIVER: overlay2
    IMAGE_NAME: "augmentedbotbattle"
    IMAGE_TAG: "${CI_COMMIT_TAG:-$(cat VERSION)}"
    FULL_IMAGE_NAME: "${AZURE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
    LATEST_IMAGE_NAME: "${AZURE_REGISTRY}/${IMAGE_NAME}:latest"
  before_script:
    # Install dependencies
    - apk add --no-cache curl bash git

    # Install Taskfile
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
    # Login to Azure Container Registry
    - echo "AZURE_REGISTRY_USERNAME length $(printf %s "$AZURE_REGISTRY_USERNAME" | wc -c)"
    - echo "AZURE_REGISTRY_PASSWORD length $(printf %s "$AZURE_REGISTRY_PASSWORD" | wc -c)"
    - test -n "$AZURE_REGISTRY_PASSWORD"
    - echo "🔐 Logging into Azure Container Registry..."
    - echo "$AZURE_REGISTRY_PASSWORD" | docker login $AZURE_REGISTRY -u $AZURE_REGISTRY_USERNAME --password-stdin
  script:
    # Verify artifacts are present
    - echo "📦 Verifying build artifacts..."
    - ls -R build/unity/ || true
    - ls -R project/Unity/ABB/build/unity/ || true
    - echo "CI_COMMIT_TAG='${CI_COMMIT_TAG}'"
    - echo "CI_COMMIT_SHORT_SHA='${CI_COMMIT_SHORT_SHA}'"
    - echo "IMAGE_TAG avant override='${IMAGE_TAG}'"

    # Sécuriser IMAGE_TAG dans le shell (pas dans variables:)
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        export IMAGE_TAG="${CI_COMMIT_TAG}"
      else
        export IMAGE_TAG="$(cat VERSION)"
      fi
      export FULL_IMAGE_NAME="${AZURE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
      export LATEST_IMAGE_NAME="${AZURE_REGISTRY}/${IMAGE_NAME}:latest"

    - echo "IMAGE_TAG après override='${IMAGE_TAG}'"
    - echo "FULL_IMAGE_NAME='${FULL_IMAGE_NAME}'"
    - echo "LATEST_IMAGE_NAME='${LATEST_IMAGE_NAME}'"

    - |
      docker build \
        --tag ${FULL_IMAGE_NAME} \
        --tag ${LATEST_IMAGE_NAME} \
        --tag ${AZURE_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHORT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG:-dev} \
        --file .config/docker/Dockerfile.prod \
        .
    # Push to Azure Container Registry
    - echo "⬆ Pushing image to Azure Container Registry..."
    - docker push ${FULL_IMAGE_NAME}
    - docker push ${LATEST_IMAGE_NAME}
    - docker push ${AZURE_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    # Display image info
    - echo "✅ Image pushed successfully!"
    - echo " Image:${FULL_IMAGE_NAME}"
    - echo " Latest:${LATEST_IMAGE_NAME}"
    - docker images | grep ${IMAGE_NAME}
  after_script:
    # Cleanup
    - docker logout $AZURE_REGISTRY || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - build/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
