# This is a GitLab CI/CD configuration file for the feedback stage in a DevSecOps pipeline.
# It is included in the main .gitlab-ci.yml and specifies the feedback stage of the
feedback:
  stage: feedback
  needs:
    - job: monitor
      artifacts: true
      optional: true
  tags:
    - docker
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache curl bash jq
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz | tar -xzf - -C /usr/local/bin task
  script:
    - task feedback
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/feedback/
  rules:
    - if: '$CI_COMMIT_TAG == "production"'
      when: always
    - when: never
