# This file defines the CI/CD pipeline for code quality checks, including linting and SonarQube analysis.
# It is included in the main .gitlab-ci.yml and specifies the code stage of the DevSecOps pipeline.
code:lint:branch:
  stage: code
  needs: []  
  tags:
    - docker
  image: alpine:3.19
  before_script:
    - apk add --no-cache git bash curl
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
  script:
    - task code:branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never 
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_CODE_SCHEDULE == "1"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^dev$/
      when: never
    - if: $CI_COMMIT_TAG =~ /^production$/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: always

# Lintting commit messages with commitlint
code:commitlint:
  stage: code
  needs: []
  tags:
    - docker
  image: node:20-alpine
  before_script:
    - apk add --no-cache git bash curl
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
    - task --version
    - git fetch origin main
  script:
    - task code:commitlint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_CODE_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^dev$/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_TAG =~ /^production$/
      when: never
    - when: always

# Lintting commit messages with commitizen
code:commitizen:
  stage: code
  needs: []
  tags:
    - docker
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - pip install commitizen
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
  script:
    - task code:commitizen
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: always

# Code Linting with MegaLinter
code:megalinter:
  stage: code
  needs: []
  tags:
    - docker
  image: oxsecurity/megalinter:v8
  variables:
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    MEGALINTER_CONFIG: '.config/devsecops/code/megalinter/config.yml'
  before_script: []
  script: ["true"]
  artifacts:
    when: always
    expire_in: 2 days
    paths:
      - megalinter-reports/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never 
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_CODE_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^dev$/
      when: never
    - if: $CI_COMMIT_TAG =~ /^production$/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: always

# Code analysis and SonarQube scanning
code:sonarqube:
  stage: code
  needs: []
  tags:
    - docker
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - .nuget/packages
  before_script:
    - dotnet --info
    - apt-get update && apt-get install -y curl jq openjdk-17-jre-headless
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
  script:
    - task code:sonarqube
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
  artifacts:
    when: always
    paths:
      - reports/coverage/
      - reports/sonar-issues.raw.jsonl
      - reports/sonar-issues.min.json
      - reports/sonar-issues.summary.json

# Security Vulnerability Scanning job
scan:security:
  stage: code
  needs: []
  tags:
    - docker
  # we use this image because it has both Trivy and
  # OWASP Dependency-Check pre-installed
  # which are the tools we use for security scanning
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl bash git wget unzip ca-certificates
    - curl -sL https://taskfile.dev/install.sh | bash -s -- -d -b /usr/local/bin
    - task --version
  script:
    - task code:security
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/security/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ALL_SCHEDULE == "1"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_CODE_SCHEDULE == "1"'
      when: always
    - if: $CI_COMMIT_TAG =~ /^dev$/
      when: never
    - if: $CI_COMMIT_TAG =~ /^production$/
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: always