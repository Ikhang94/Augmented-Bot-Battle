# This is a GitLab CI/CD configuration file for the monitoring stage in a DevSecOps pipeline.
# It is included in the main .gitlab-ci.yml and specifies the monitoring stage of the
monitor:
  stage: monitor
  needs:
    - job: operate
      optional: true
  image: ubuntu:22.04
  tags:
    - docker
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git tar python3 python3-pip bc
    - pip install --upgrade pip azure-cli
    - mkdir -p ./bin
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz | tar -xzf - -C ./bin
    - mv ./bin/task /usr/local/bin/task
    - az login --service-principal --username="$SPN_CLIENT_ID" --password="$SPN_CLIENT_SECRET" --tenant="$SPN_TENANT_ID"
    - az account set --subscription="$AZ_SUBSCRIPTION_ID"
  script:
    - task monitor
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/monitor/
  rules:
    - if: '$CI_COMMIT_TAG == "production"'
      when: always
    - when: never
