# Plan job
plan:
  stage: plan
  tags:
    - docker
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl bash
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz
      | tar -xzf - -C /usr/local/bin task
  script:
    - task plan
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_TAG =~ /^staging$/
      when: never
    - if: $CI_COMMIT_TAG =~ /^production$/
      when: never
    # Do not execute default jobs on the main branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    # Run in all other cases (MRs, feature branches, etc.)
    - when: always
