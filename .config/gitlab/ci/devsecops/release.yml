
# Shared setup for all release jobs (Debian + Azure CLI + task)
.release_setup:
  image: ubuntu:22.04
  tags:
    - docker
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git tar python3 python3-pip
    - pip install --upgrade pip azure-cli
    - mkdir -p ./bin
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz | tar -xzf - -C ./bin
    - mv ./bin/task /usr/local/bin/task
    - echo "SPN_CLIENT_ID length:" $(echo -n "$SPN_CLIENT_ID" | wc -c)
    - echo "SPN_CLIENT_SECRET length:" $(echo -n "$SPN_CLIENT_SECRET" | wc -c)
    - echo "SPN_TENANT_ID length:" $(echo -n "$SPN_TENANT_ID" | wc -c)
    - az login --service-principal --username="$SPN_CLIENT_ID" --password="$SPN_CLIENT_SECRET" --tenant="$SPN_TENANT_ID"
    - az account set --subscription="$AZ_SUBSCRIPTION_ID"
    - az account show

version:bump:
  stage: build
  image: alpine:3.19
  tags:
    - docker
  before_script:
    - apk add --no-cache git curl
    - mkdir -p ./bin
    - curl -sL https://github.com/go-task/task/releases/download/v3.50.0/task_linux_amd64.tar.gz | tar -xzf - -C ./bin
    - mv ./bin/task /usr/local/bin/task
    - git config --global user.email "dsemakia@gmail.com"
    - git config --global user.name "Semakia"
    - if [ -n "$CI_JOB_TOKEN" ]; then git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"; fi
    - if [ -n "$GITLAB_TOKEN" ]; then git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"; fi
  script:
    - task version:bump
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

release:dev:
  extends: .release_setup
  stage: release
  script:
    - task release:dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never

release:prod:
  extends: .release_setup
  stage: release
  script:
    - task release:prod
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: never
